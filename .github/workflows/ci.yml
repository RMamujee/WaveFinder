name: CI

# push is scoped to main so PR branches don't run every job twice
# (push + pull_request both fired before).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  next-build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Without DATABASE_URL the build skips the 1,490-spot prerender by design
      # (app/spots/[slug]/page.tsx); all other env degrades gracefully at build
      # time, so this catches compile/build breaks before the Vercel deploy.
      - name: Build
        run: npm run build
